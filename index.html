<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skina Fresca – Edinardo Lanches</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --creme: #efe3c8;
    --marrom: #4a2c1f;
    --amarelo: #f0e24a;
    --cinza: #d9d9d9;
    --borda: #8a8a8a;
    --vermelho: #d40000;
    --texto: #1c1c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--texto); background: #fff; }

  /* Cabeçalho */
  .marca-topo { background: #f1ebd5; }
  .marca-quadro { position: relative; max-width: 1808px; margin: 0 auto; container-type: inline-size; }
  .marca-quadro img { display: block; width: 100%; height: auto; }

  /* Busca e pedido */
  .topo { display: flex; gap: 20px; align-items: center; padding: 20px 6vw; }
  #busca { flex: 1; height: 40px; padding: 0 18px; border: 1px solid var(--borda); border-radius: 999px; font: inherit; font-size: .9rem; }
  #abrirCarrinho { white-space: nowrap; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border: 1px solid var(--borda); border-radius: 999px; background: #fff; font: inherit; font-size: .9rem; cursor: pointer; }
  #contador { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--vermelho); color: #fff; font-size: .75rem; font-weight: 700; }

  /* Layout */
  .layout { display: flex; gap: 24px; padding: 0 6vw 48px; align-items: flex-start; }
  .menu { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; width: 150px; flex-shrink: 0; }
  .menu button { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-radius: 10px; background: var(--cinza); font: inherit; font-size: .85rem; font-weight: 600; text-align: left; cursor: pointer; }
  .menu .ico { width: 16px; height: 16px; margin-right: -4px; flex-shrink: 0; }
  .menu button.ativo { background: var(--amarelo); }
  .menu button:focus-visible, #abrirCarrinho:focus-visible, .card:focus-visible, #busca:focus-visible { outline: 3px solid var(--marrom); outline-offset: 2px; }

  #lista { flex: 1; min-width: 0; }
  .secao { margin-bottom: 28px; }
  .secao h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--borda); font-size: .95rem; }
  .secao h2 small { font-size: .72rem; font-weight: 600; }
  .secao h3 { margin: 18px 0 10px; font-size: .85rem; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 14px; }

  /* Card */
  .card { display: flex; flex-direction: column; padding: 6px; border: 1px solid var(--borda); border-radius: 12px; background: var(--cinza); cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--creme); }
  .card .nome { margin: 8px 0 0; font-size: .72rem; font-weight: 700; line-height: 1.25; }
  .card .descricao { margin: 2px 0 0; font-size: .62rem; min-height: 1em; }
  .card .preco { margin-top: auto; padding-top: 8px; font-size: .72rem; font-weight: 700; }
  .card:active { transform: scale(.98); }

  .vazio { padding: 40px 0; text-align: center; }

  @media (max-width: 600px) {
    .topo { gap: 10px; padding-inline: 4vw; }
    #busca { min-width: 0; }
  }
  @media (max-width: 720px) {
    .layout { flex-direction: column; gap: 16px; }
    .menu { position: static; flex-direction: row; width: 100%; overflow-x: auto; padding-bottom: 4px; }
    .menu button { flex-shrink: 0; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  }

  @media (hover: hover) { .card:hover { border-color: var(--marrom); } }
  @keyframes pulo { 50% { transform: scale(1.35); } }
  #contador.pulo { animation: pulo .25s; }

  /* Painel do pedido */
  #carrinho { margin: 0 0 0 auto; padding: 0; width: min(380px, 100%); height: 100dvh; max-height: 100dvh; border: 0; background: #fff; color: var(--texto); }
  #carrinho[open] { display: flex; flex-direction: column; }
  #carrinho::backdrop { background: rgba(0, 0, 0, .4); }
  .carrinho-topo { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: var(--creme); color: var(--marrom); }
  .carrinho-topo h2 { margin: 0; font-size: 1.05rem; }
  .carrinho-topo button { border: 0; background: none; font-size: 1.4rem; line-height: 1; cursor: pointer; color: inherit; }
  #itensCarrinho { flex: 1; margin: 0; padding: 8px 18px; list-style: none; overflow-y: auto; }
  #itensCarrinho li { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e3e3e3; font-size: .85rem; }
  #itensCarrinho small { display: block; font-size: .72rem; color: #555; }
  #itensCarrinho .vazio { display: block; border: 0; padding: 32px 0; text-align: center; }
  .qtd { display: flex; align-items: center; gap: 8px; }
  .qtd button { width: 26px; height: 26px; border: 1px solid var(--borda); border-radius: 50%; background: var(--cinza); font-size: 1rem; line-height: 1; cursor: pointer; }
  .sub { min-width: 64px; text-align: right; font-weight: 700; }
  .carrinho-rodape { padding: 16px 18px; border-top: 1px solid var(--borda); }
  .total { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 700; }
  .acoes { display: flex; gap: 10px; }
  .acoes button { flex: 1; height: 40px; border: 1px solid var(--borda); border-radius: 999px; background: #fff; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
  .acoes #finalizar { background: var(--amarelo); border-color: var(--amarelo); }
  .acoes button:disabled { opacity: .45; cursor: not-allowed; }
  .carrinho-rodape button:focus-visible, .carrinho-topo button:focus-visible, .qtd button:focus-visible { outline: 3px solid var(--marrom); outline-offset: 2px; }
  .campos { display: grid; gap: 8px; margin-bottom: 12px; }
  .campos input, .campos textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--borda); border-radius: 10px; font: inherit; font-size: .85rem; resize: none; }
  .campos input.erro { border-color: var(--vermelho); }
  #erroNome { color: var(--vermelho); font-size: .72rem; }
  .acoes #finalizar::before { content: "💬 "; }
  @media (prefers-reduced-motion: reduce) { #contador.pulo { animation: none; } }
</style>
</head>
<body>

<header class="marca-topo">
  <div class="marca-quadro">
    <img src="img/banner.jpg" width="1808" height="390" alt="Skina Fresca – Edinardo Lanches" fetchpriority="high">
  </div>
</header>

<div class="topo">
  <input id="busca" type="search" placeholder="Busque por um item..." aria-label="Buscar item">
  <button id="abrirCarrinho" type="button">Meu pedido <span id="contador" aria-live="polite">0</span></button>
</div>

<div class="layout">
  <nav class="menu" aria-label="Categorias">
    <button type="button" class="ativo" data-categoria="Início">🏠 Início</button>
    <button type="button" data-categoria="Sanduíches">🥪 Sanduíches</button>
    <button type="button" data-categoria="Tapiocas"><img class="ico" src="img/icone-tapioca.png" alt="" width="16" height="16">Tapiocas</button>
    <button type="button" data-categoria="Cuscuz">🍚 Cuscuz</button>
    <button type="button" data-categoria="Salgados">🥟 Salgados</button>
    <button type="button" data-categoria="Bebidas">🥤 Bebidas</button>
  </nav>

  <main id="lista">
    <!-- Cards de exemplo (o JS abaixo substitui tudo isto ao carregar) -->
    <section class="secao" data-secao="Sanduíches">
      <h2>Sanduíches</h2>
      <div class="grade">
        <article class="card" tabindex="0">
          <img src="" alt="Misto">
          <h3 class="nome">Misto</h3>
          <p class="descricao"></p>
          <span class="preco">R$ 5,00</span>
        </article>
        <article class="card" tabindex="0">
          <img src="" alt="Tapioca com coco">
          <h3 class="nome">Tapioca com coco</h3>
          <p class="descricao">Pequena</p>
          <span class="preco">R$ 2,00</span>
        </article>
      </div>
    </section>
  </main>
</div>

<dialog id="carrinho" aria-labelledby="tituloCarrinho">
  <div class="carrinho-topo">
    <h2 id="tituloCarrinho">Meu pedido</h2>
    <button type="button" id="fecharCarrinho" aria-label="Fechar pedido">×</button>
  </div>
  <ul id="itensCarrinho"></ul>
  <div class="carrinho-rodape">
    <div class="campos">
      <input id="nomeCliente" type="text" placeholder="Seu nome" autocomplete="name" aria-label="Seu nome">
      <small id="erroNome" hidden>Informe seu nome para enviar o pedido.</small>
      <textarea id="observacao" rows="2" placeholder="Observações (ex.: sem cebola, troco para R$ 50)" aria-label="Observações"></textarea>
    </div>
    <div class="total"><span>Total</span><span id="totalCarrinho">R$ 0,00</span></div>
    <div class="acoes">
      <button type="button" id="limparCarrinho">Limpar</button>
      <button type="button" id="finalizar">Enviar pelo WhatsApp</button>
    </div>
  </div>
</dialog>

<script>
/* ====== DADOS: troque este array pela sua fonte de dados ======
   Campos: id, categoria, sub (opcional), nome, descricao, preco (número), img (URL)  */
let produtos = [];
// Os produtos agora vêm da planilha do Google (veja carregarProdutos() mais abaixo).

const ordem = ["Sanduíches", "Tapiocas", "Cuscuz", "Salgados", "Bebidas"];
const notas = { Tapiocas: "Tapioca (grande) cada acréscimo R$ 2,00", Cuscuz: "cada acréscimo R$ 2,00" };
const VAZIO = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const CHAVE = "skina-pedido";
// Número que recebe os pedidos: DDI + DDD + número, só dígitos (ex.: "5585999999999").
// Se deixar vazio, o WhatsApp abre e a pessoa escolhe o contato.
const WHATSAPP_NUMERO = "5585989404334";

const $lista = document.getElementById("lista");
const $busca = document.getElementById("busca");
const $contador = document.getElementById("contador");
const $carrinho = document.getElementById("carrinho");
const $itens = document.getElementById("itensCarrinho");
const $total = document.getElementById("totalCarrinho");
const $limpar = document.getElementById("limparCarrinho");
const $finalizar = document.getElementById("finalizar");

let categoriaAtiva = "Início";
let pedido = lerPedido(); // { [id]: quantidade }

/* ---------- utilidades ---------- */
const moeda = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); // "sanduiche" acha "Sanduíches"
const porId = id => produtos.find(p => String(p.id) === String(id));

function lerPedido() { try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch { return {}; } }
function salvarPedido() { try { localStorage.setItem(CHAVE, JSON.stringify(pedido)); } catch {} }

/* ---------- cardápio ---------- */
function cardHTML(p) {
  return `<article class="card" tabindex="0" role="button" data-id="${esc(p.id)}" aria-label="Adicionar ${esc(p.nome)} ${esc(p.descricao)}, ${moeda(p.preco)}">
    <img src="${esc(p.img || VAZIO)}" alt="${esc(p.nome)}" loading="lazy" onerror="this.onerror=null;this.src='${VAZIO}'">
    <h3 class="nome">${esc(p.nome)}</h3>
    <p class="descricao">${esc(p.descricao)}</p>
    <span class="preco">${moeda(p.preco)}</span>
  </article>`;
}

function render() {
  const termo = norm($busca.value.trim());
  let html = "";
  for (const cat of ordem) {
    if (categoriaAtiva !== "Início" && categoriaAtiva !== cat) continue;
    const itens = produtos.filter(p => p.categoria === cat && p._busca.includes(termo));
    if (!itens.length) continue;

    const grupos = [...new Set(itens.map(p => p.sub || ""))];
    const corpo = grupos.map(g => `
      ${g ? `<h3>${esc(g)}</h3>` : ""}
      <div class="grade">${itens.filter(p => (p.sub || "") === g).map(cardHTML).join("")}</div>`).join("");

    html += `<section class="secao" data-secao="${esc(cat)}">
      <h2>${esc(cat)}${notas[cat] ? ` <small>• ${esc(notas[cat])}</small>` : ""}</h2>${corpo}</section>`;
  }
  $lista.innerHTML = html || `<p class="vazio">Nenhum item encontrado. Tente outro nome.</p>`;
}

/* ---------- pedido ---------- */
function itensPedido() {
  return Object.entries(pedido).filter(([id]) => porId(id)).map(([id, qtd]) => ({ ...porId(id), qtd }));
}
const totalPedido = () => itensPedido().reduce((s, i) => s + i.preco * i.qtd, 0);

function atualizarPedido() {
  const itens = itensPedido();
  $contador.textContent = itens.reduce((s, i) => s + i.qtd, 0);
  $itens.innerHTML = itens.length ? itens.map(i => `
    <li data-id="${esc(i.id)}">
      <div><strong>${esc(i.nome)}</strong><small>${esc(i.descricao)}</small></div>
      <div class="qtd">
        <button type="button" data-acao="menos" aria-label="Remover um ${esc(i.nome)}">−</button>
        <span>${i.qtd}</span>
        <button type="button" data-acao="mais" aria-label="Adicionar mais um ${esc(i.nome)}">+</button>
      </div>
      <span class="sub">${moeda(i.preco * i.qtd)}</span>
    </li>`).join("") : `<li class="vazio">Seu pedido está vazio. Toque em um item para adicionar.</li>`;
  $total.textContent = moeda(totalPedido());
  $limpar.disabled = $finalizar.disabled = !itens.length;
}

function alterar(id, delta) {
  const q = (pedido[id] || 0) + delta;
  if (q > 0) pedido[id] = q; else delete pedido[id];
  salvarPedido();
  atualizarPedido();
  document.dispatchEvent(new CustomEvent("pedido:alterado", { detail: { itens: itensPedido(), total: totalPedido() } }));
}

function adicionar(id) {
  alterar(id, 1);
  $contador.classList.remove("pulo"); void $contador.offsetWidth; $contador.classList.add("pulo");
  document.dispatchEvent(new CustomEvent("pedido:adicionar", { detail: porId(id) }));
}

/* ---------- eventos ---------- */
document.querySelectorAll("[data-categoria]").forEach(btn => {
  btn.addEventListener("click", () => {
    categoriaAtiva = btn.dataset.categoria;
    document.querySelectorAll("[data-categoria]").forEach(b => b.classList.toggle("ativo", b === btn));
    render();
  });
});

let espera;
$busca.addEventListener("input", () => { clearTimeout(espera); espera = setTimeout(render, 120); });

$lista.addEventListener("click", e => { const c = e.target.closest(".card"); if (c) adicionar(c.dataset.id); });
$lista.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const c = e.target.closest(".card");
  if (c) { e.preventDefault(); adicionar(c.dataset.id); }
});

document.getElementById("abrirCarrinho").addEventListener("click", () => {
  $carrinho.showModal();
  document.dispatchEvent(new CustomEvent("pedido:abrir", { detail: itensPedido() }));
});
document.getElementById("fecharCarrinho").addEventListener("click", () => $carrinho.close());
$carrinho.addEventListener("click", e => { if (e.target === $carrinho) $carrinho.close(); }); // clique no fundo
$itens.addEventListener("click", e => {
  const b = e.target.closest("[data-acao]");
  if (b) alterar(b.closest("li").dataset.id, b.dataset.acao === "mais" ? 1 : -1);
});
$limpar.addEventListener("click", () => { pedido = {}; salvarPedido(); atualizarPedido(); });
const $nome = document.getElementById("nomeCliente");
const $erroNome = document.getElementById("erroNome");
const $obs = document.getElementById("observacao");
$nome.addEventListener("input", () => { $nome.classList.remove("erro"); $erroNome.hidden = true; });

function mensagemWhatsApp(nome, obs) {
  const linhas = itensPedido().map(i =>
    `${i.qtd}x ${i.nome}${i.descricao ? " (" + i.descricao + ")" : ""} - ${moeda(i.preco * i.qtd)}`);
  return [
    "*Novo pedido - Skina Fresca*",
    `Cliente: ${nome}`,
    "",
    ...linhas,
    "",
    `*Total: ${moeda(totalPedido())}*`,
    obs ? `Obs.: ${obs}` : ""
  ].filter((l, i, a) => l !== "" || (a[i - 1] !== "" && i < a.length - 1)).join("\n");
}

$finalizar.addEventListener("click", () => {
  const nome = $nome.value.trim();
  if (!nome) { $nome.classList.add("erro"); $erroNome.hidden = false; $nome.focus(); return; }
  const obs = $obs.value.trim();
  document.dispatchEvent(new CustomEvent("pedido:finalizar", { detail: { itens: itensPedido(), total: totalPedido(), nome, obs } }));
  const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensagemWhatsApp(nome, obs))}`;
  window.open(url, "_blank", "noopener");
});

/* ---------- início ---------- */
// Link CSV da planilha do Google (Arquivo > Compartilhar > Publicar na Web > CSV)
const URL_PLANILHA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpNJzXqq7hM5gtAoJsyiFj9AZoRLOD03wdtgY6RNsqW3RN8V8wWaWQD-CEL4IdFJnO-CPG6Vl8OS8b/pub?gid=342467805&single=true&output=csv";

async function carregarProdutos() {
  const resposta = await fetch(URL_PLANILHA);
  const texto = await resposta.text();
  const linhas = texto.trim().split("\n").slice(1); // pula o cabeçalho

  return linhas.map((linha, i) => {
    // separa por vírgula, mas respeita textos entre aspas (ex.: "Pão, queijo e presunto")
    const campos = linha.match(/(".*?"|[^,]+|)(?=,|$)/g).map(c => c.replace(/^"|"$/g, "").trim());
    const [nome, categoria, sub, descricao, preco, foto, disponivel] = campos;
    return {
      id: i + 1,
      nome,
      categoria,
      sub: sub || undefined,
      descricao: descricao || "",
      preco: parseFloat(String(preco).replace(",", ".")) || 0,
      img: foto || ""
    };
  }).filter(p => (p.disponivel || "sim").trim().toLowerCase() !== "não" && p.nome);
}

(async () => {
  produtos = await carregarProdutos();
  produtos.forEach(p => { p._busca = norm(p.nome + " " + p.descricao); });
  render();
  atualizarPedido();
})();
</script>
</body>
</html>
